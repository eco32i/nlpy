# =============================================================================
# Modern tmux starter config – Catppuccin + powerline-style status
# Ubuntu 26.04 / tmux 3.6+
# =============================================================================

# -----------------------------------------------------------------------------
# Core settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,foot*:RGB,alacritty*:RGB,xterm-kitty:RGB,xterm-ghostty:RGB"
set -g set-clipboard on              # OSC 52, so copying works over SSH

set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on
set -g display-time 4000
set -g status-interval 5
set -g status-position top          # modern look; change to bottom if you prefer

# Vi mode
setw -g mode-keys vi
set -g status-keys vi

# -----------------------------------------------------------------------------
# Prefix & key bindings
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Better splits (keep current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (also handled by vim-tmux-navigator plugin)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` is bound by tmux-yank, which pipes through ~/.local/bin/tmux-copy (see @override_copy_command below)

# -----------------------------------------------------------------------------
# Catppuccin theme configuration (must be before the plugin is loaded)
# -----------------------------------------------------------------------------
set -g @catppuccin_flavor "macchiato"                    # latte | frappe | macchiato | mocha

# Window style – "rounded" or "slanted" give nice powerline-ish separators
set -g @catppuccin_window_status_style "slanted"

# Status module separators (powerline style – requires a Nerd Font)
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

# Optional: make status background transparent
# set -g @catppuccin_status_background "none"

# Window text
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"               # none | icon | text

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'              # system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'         # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # auto-save + restore
set -g @plugin 'christoomey/vim-tmux-navigator'      # seamless nvim ↔ tmux panes
set -g @plugin 'sainnhe/tmux-fzf'                    # fzf menus (prefix + F)
set -g @plugin 'catppuccin/tmux#v2.3.0'              # pin a known good tag

# Continuum / Resurrect
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'            # restore nvim sessions if possible
set -g @resurrect-capture-pane-contents 'on'

# Clipboard backend (wl-copy / xclip / OSC 52) is chosen at copy time by this helper
set -g @override_copy_command '$HOME/.local/bin/tmux-copy'

# tmux-fzf launch key (default is prefix + F)
# set -g @tmux-fzf-launch-key 'C-f'

# -----------------------------------------------------------------------------
# Status bar – Catppuccin modules (set AFTER the theme options, before TPM run)
# -----------------------------------------------------------------------------
set -g status-left-length 100
set -g status-right-length 100

# Left: session name
set -g status-left "#{E:@catppuccin_status_session}"

# Right: application | host | date_time  (add more modules as desired)
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Optional extra modules (uncomment + install the corresponding plugin if needed)
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# -----------------------------------------------------------------------------
# Initialize TPM (keep this line at the very bottom)
# -----------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'
